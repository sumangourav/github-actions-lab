name: Python CI Pipeline

on:
  push:
    branches:
      - main

jobs:

  test:
    name: Test Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest

      - name: Create test result file
        run: |
          echo "Tests completed successfully" > test-result.txt
          echo "This file was created in Test Job" >> test-result.txt
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-result
          path: test-result.txt


  build:
      name: Build Application

      needs: test

      runs-on: ubuntu-latest

      outputs:
        build_version: ${{ steps.version.outputs.build_version }}

      steps:

        - name: Checkout code
          uses: actions/checkout@v4

        - name: Download test artifact
          uses: actions/download-artifact@v5
          with:
            name: test-result

        - name: Verify test artifact
          run: |
            echo "Downloaded test artifact:"
            cat test-result.txt

        - name: Generate build version
          id: version
          run: |
            echo "build_version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

        - name: Show build version
          run: |
            echo "Build version: ${{ steps.version.outputs.build_version }}"

        - name: Build application
          run: |
            mkdir build
            cp app.py build/
            cp requirements.txt build/
            echo "Build version: ${{ steps.version.outputs.build_version }}" > build/build-info.txt

        - name: Verify build
          run: |
            echo "Build contents:"
            ls -la build
            echo "Build information:"
            cat build/build-info.txt

        - name: Upload build artifact
          uses: actions/upload-artifact@v4
          with:
            name: python-app
            path: build/
  deploy:
    name: Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::537621751610:role/github-actions-deploy-role
          aws-region: ap-south-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity