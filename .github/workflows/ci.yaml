name: Python CI Pipeline

on:
  push:
    branches:
      - main

jobs:

  test:
    name: Test Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest

      - name: Create test result file
        run: |
          echo "Tests completed successfully" > test-result.txt
          echo "This file was created in Test Job" >> test-result.txt


  build:
    name: Build Application

    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application
        run: |
          mkdir build
          cp app.py build/
          cp requirements.txt build/
      - name: Verify build
        run: |
          echo "Build contents:"
          ls -la build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: build/